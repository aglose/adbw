name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported version (the python3 that ships with macOS).
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Fake adbd + simulated agent + a proxy that kills and freezes the link mid-transfer.
      - name: Resume and auth tests
        run: python host/test_resume.py
      - name: CLI smoke test
        run: python host/adbw.py --version

  build:
    name: Build agent APK and single-file tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: python scripts/build_dist.py
      - name: Run the built file
        run: |
          python dist/adbw --version
          python dist/adbw devices --state-dir "$RUNNER_TEMP/adbw-home"
      - uses: actions/upload-artifact@v7
        with:
          name: adbw-dist
          path: dist/

  homebrew:
    name: Homebrew install from this tap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the released file the cask points at, the way the README says to.
      - name: Tap, trust, install
        run: |
          brew tap aglose/adbw "$GITHUB_WORKSPACE"
          brew trust aglose/adbw || true   # older Homebrew has no trust step
          brew install adbw
      - name: Run the installed tool
        run: |
          want=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/adbw.rb)
          test "$(adbw --version)" = "adbw $want"
          adbw devices --state-dir "$RUNNER_TEMP/adbw-home"
          brew uninstall adbw
